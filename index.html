<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
</head>
<body>
    <div class="page">

        <header class="header">
            <h1>Expense Tracker</h1>
            <button type="button" id="theme-button" class="button outline-button">Dark Mode</button>
        </header>


        <!-- left side(form input) -->

         <section class="box" id="form-box">

            <h2 id="form-heading">Add an Expense</h2>

            <form id="expense-form" novalidate>

                <div class="field">
                    <label for="title-input">Title</label>
                    <input type="text" id="title-input" placeholder="e.g. Dessert">
                    <p class="error" id="title-error"></p>
                </div>

                <div class="row">
                    <div class="field">
                        <label for="amount-input">Amount</label>
                        <input id="amount-input" type="number" step="0.01" placeholder="0.00">
                        <p class="error" id="amount-error"></p>
                    </div>
                    <div class="field">
                        <label for="date-input">Date</label>
                        <input type="date" id="date-input">
                        <p class="error" id="date-error"></p>
                    </div>
                </div>

                <div class="field">
                    <label for="category-input">Category</label>
                    <select id="category-input"></select>
                    <p class="error" id="category-error"></p>
                </div>

                <div class="row">
                    <button type="submit" id="save-button" class="button">Add Expense</button>
                    <button type="button" id="cancel-button" class="button outline-button" hidden>Cancel</button>
                </div>

            </form>

         </section>


         <!-- right side(total expenses and list of it) -->

         <div class="right-side">

            <section class="box" id="totals-box">
                <h2>Totals</h2>
                <p>Total Money Spent</p>
                <p class="big-number" id="total-spent">0</p>
                <ul id="category-totals"></ul>
            </section>

            <section class="box" id="list-box">

                <h2>Expenses</h2>

                <div class="filters">

                    <div class="field">
                        <label for="filter-category">Category</label>
                        <select id="filter-category"></select>
                    </div>
                    <div class="field">
                        <label for="filter-month">Month</label>
                        <input type="month" id="filter-month">
                    </div>
                    <div class="field">
                        <label for="sort-select">Sort By</label>
                        <select id="sort-select">
                            <option value="date-new">Date: newset first</option>
                            <option value="date-old">Date: oldest first</option>
                            <option value="amount-high">Amount: high to low</option>
                            <option value="amount-low">Amount: low to high</option>
                        </select>
                    </div>
                    <button type="button" id="clear-button" class="button outline-button">Clear Filters</button>

                </div>

                <ul id="expense-list"></ul>
                <p id="empty-message" hidden></p>

            </section>


         </div>
          

    </div>
    <script src="script.js"></script>
</body>
</html>
